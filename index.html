<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vijay Motors | Pre-owned Cars in Hubli</title>
  <meta name="description" content="Browse quality pre-owned cars at Vijay Motors, Unkal, Hubli.">
  <meta property="og:title" content="Vijay Motors | Pre-owned Cars in Hubli">
  <meta property="og:type" content="website">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #F8F5EF;
      --or: #C77B52;
      --beige: #EAE2D7;
      --ink: #292724;
      --mut: #827D76
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font: 16px/1.5 'DM Sans', system-ui, sans-serif;
      background: var(--cream);
      color: var(--ink)
    }

    a {
      color: inherit;
      text-decoration: none
    }

    h1,
    h2,
    h3 {
      margin: 0 0 8px
    }

    .w {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 20px
    }

    .pad {
      padding: 40px 20px
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(248, 245, 239, .82);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--beige)
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      gap: 12px
    }

    .logo {
      font-weight: 700;
      letter-spacing: .16em;
      display: flex;
      align-items: center;
      gap: 10px
    }

    .logo img {
      width: 46px;
      height: 46px;
      border-radius: 50%
    }

    .adm {
      color: var(--or) !important;
      font-weight: 500
    }

    .logo b {
      color: var(--or)
    }

    nav a {
      margin: 0 12px;
      color: var(--mut)
    }

    nav a:hover {
      color: var(--ink)
    }

    #ham {
      display: none;
      background: none;
      border: 0;
      font-size: 26px;
      cursor: pointer
    }

    .btn {
      display: inline-block;
      border: 1px solid var(--or);
      border-radius: 999px;
      padding: 12px 22px;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      background: var(--or);
      color: #fff;
      text-align: center
    }

    .btn.g {
      background: transparent;
      border-color: var(--ink);
      color: var(--ink)
    }

    .btn.s {
      padding: 7px 14px;
      font-size: 14px
    }

    .off {
      opacity: .4;
      pointer-events: none
    }

    .hero {
      padding: 70px 20px 30px
    }

    .hero h1 {
      font-size: clamp(34px, 6vw, 60px);
      line-height: 1.05;
      max-width: 720px
    }

    .kick {
      color: var(--or);
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: 13px
    }

    .lead {
      color: var(--mut);
      max-width: 560px;
      font-size: 18px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 20px
    }

    .card {
      display: block;
      background: #fff;
      border: 1px solid var(--beige);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(41, 39, 36, .05);
      transition: .2s
    }

    .card:hover {
      transform: translateY(-3px)
    }

    .img {
      aspect-ratio: 4/3;
      background: var(--beige);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--mut);
      position: relative
    }

    .img img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--ink);
      color: #fff;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 99px
    }

    .tag.d {
      left: auto;
      right: 10px;
      background: var(--or)
    }

    .p {
      padding: 16px
    }

    .p h3 {
      font-size: 18px
    }

    .m {
      color: var(--mut);
      font-size: 14px;
      margin: 4px 0
    }

    .pr {
      font-size: 22px;
      font-weight: 700;
      margin: 6px 0
    }

    .glass {
      background: rgba(255, 255, 255, .7);
      backdrop-filter: blur(12px);
      border: 1px solid var(--beige);
      border-radius: 20px;
      padding: 16px;
      margin: 16px 0
    }

    summary {
      cursor: pointer;
      font-weight: 500
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 0
    }

    .chip {
      border: 1px solid var(--beige);
      background: #fff;
      border-radius: 99px;
      padding: 8px 16px;
      cursor: pointer;
      font: inherit;
      white-space: nowrap
    }

    .chip.on {
      background: var(--or);
      color: #fff;
      border-color: var(--or)
    }

    input,
    select,
    textarea {
      font: inherit;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--beige);
      border-radius: 12px;
      background: #fff;
      color: var(--ink)
    }

    input:focus,
    select:focus,
    textarea:focus,
    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--or);
      outline-offset: 2px
    }

    label {
      font-size: 13px;
      color: var(--mut);
      display: block;
      margin-top: 6px
    }

    .f {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px
    }

    .sk {
      height: 300px;
      background: linear-gradient(90deg, var(--beige), #fff, var(--beige));
      background-size: 200% 100%;
      animation: s 1.4s infinite;
      border-radius: 20px
    }

    @keyframes s {
      to {
        background-position: -200% 0
      }
    }

    .det {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 28px
    }

    #big {
      width: 100%;
      border-radius: 20px;
      aspect-ratio: 4/3;
      object-fit: cover;
      background: var(--beige)
    }

    .th {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      overflow-x: auto
    }

    .th img {
      width: 80px;
      height: 60px;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer
    }

    .spec {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 16px 0
    }

    .spec div {
      background: #fff;
      border: 1px solid var(--beige);
      border-radius: 12px;
      padding: 8px 12px
    }

    .spec small {
      display: block;
      color: var(--mut)
    }

    .soldbn {
      background: var(--ink);
      color: #fff;
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 700;
      margin: 12px 0
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border: 1px solid var(--beige);
      border-radius: 14px;
      padding: 12px;
      margin: 8px 0
    }

    .row>div:first-child {
      flex: 1 1 200px
    }

    .st {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px
    }

    .st div {
      background: #fff;
      border: 1px solid var(--beige);
      border-radius: 16px;
      padding: 16px
    }

    .st b {
      font-size: 28px;
      display: block
    }

    .ims {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 10px 0
    }

    .im {
      width: 140px;
      border: 2px solid var(--beige);
      border-radius: 12px;
      overflow: hidden;
      background: #fff
    }

    .im.p1 {
      border-color: var(--or)
    }

    .im img {
      width: 100%;
      height: 90px;
      object-fit: cover
    }

    .im button {
      font-size: 12px;
      margin: 2px;
      cursor: pointer
    }

    footer {
      background: #fff;
      border-top: 1px solid var(--beige);
      margin-top: 60px;
      padding: 30px 0;
      color: var(--mut);
      font-size: 14px
    }

    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translate(-50%, 80px);
      background: var(--ink);
      color: #fff;
      padding: 12px 20px;
      border-radius: 99px;
      transition: .3s;
      z-index: 50;
      max-width: 90%
    }

    #toast.on {
      transform: translate(-50%, 0)
    }

    @media(max-width:760px) {
      #ham {
        display: block
      }

      nav {
        display: none;
        width: 100%
      }

      header.open nav {
        display: block
      }

      header .nav {
        flex-wrap: wrap
      }

      nav a {
        display: block;
        margin: 0;
        padding: 10px 0
      }

      .det {
        grid-template-columns: 1fr
      }

      .dbtn {
        display: none
      }
    }
  </style>
</head>

    const F = (k, l, t = 'text', x = '') => `<div><label>${l}<input type="${t}" value="${esc(S.f[k])}" oninput="setF('${k}',this.value)" ${x}></label></div>`;
    const FS = (k, l, o) => `<div><label>${l}<select onchange="setF('${k}',this.value)">${o.map(x => `<option value="${x[0]}" ${S.f[k] === x[0] ? 'selected' : ''}>${x[1]}</option>`).join('')}</select></label></div>`;
    function home() {
      const s = S.set; return `<section class="hero w"><p class="kick">${esc(s.business_name)} · Hubli</p><h1>Find Your Next Car with Confidence.</h1><p class="lead">Explore quality pre-owned cars at Vijay Motors. Discover the right car for your needs and budget.</p><a class="btn" href="#/" onclick="go('browse');return false">Explore Available Cars</a> <a class="btn g" href="#/" onclick="go('contact');return false">Contact Vijay Motors</a> <a class="btn g" href="https://www.instagram.com/vijay_motors_hubli_?mdxt=b3Z3aXdvZDNtaTE1" target="_blank" rel="noopener noreferrer">Instagram</a> <a class="btn g" href="https://youtube.com/@vijaymotorshubli6871?si=kx0N23jVkbg5tQME" target="_blank" rel="noopener noreferrer">YouTube</a></section>
<section id="categories" class="w"><div id="chips" class="chips"></div></section>
<section id="browse" class="w"><details class="glass" ontoggle="S.fo=this.open" ${(S.fo ?? innerWidth > 760) ? 'open' : ''}><summary>Search, filters &amp; sorting</summary><div class="f">${F('q', 'Search make or model')}${F('min', 'Min price (₹)', 'number')}${F('max', 'Max price (₹)', 'number')}${F('year', 'Year from', 'number')}${FS('fuel', 'Fuel', [['', 'Any'], ...FUELS.map(x => [x, L(x)])])}${FS('tr', 'Transmission', [['', 'Any'], ['manual', 'Manual'], ['automatic', 'Automatic']])}${F('km', 'Max km driven', 'number')}${FS('av', 'Availability', [['available', 'Available'], ['sold_out', 'Sold Out'], ['all', 'All']])}${FS('sort', 'Sort by', [['new', 'Newest model year'], ['lo', 'Price: Low to High'], ['hi', 'Price: High to Low']])}</div><p><button class="btn g s" onclick="clearF()">Clear Filters</button></p></details>${sb ? '' : '<p class="m">Inventory is not connected yet. Once the owner connects the admin database and adds cars, published listings will appear here.</p>'}<div id="res" class="grid"></div></section>
<section id="about" class="w pad"><h2>About Us</h2><p class="lead">Vijay Motors is a multi-brand pre-owned car dealer in Unkal, Hubli.</p><p>${s.services.map(esc).join(' · ')}</p></section>
<section id="contact" class="w"><h2>Contact</h2><div class="det"><div><p>📞 <a href="tel:${esc(s.phone)}">${esc(s.phone)}</a></p><p>💬 <a href="${wa('Hi Vijay Motors, I would like to know more about your cars.')}" target="_blank" rel="noopener">WhatsApp us</a></p><p>📍 ${esc(s.address)}</p>${s.maps_url ? `<p><a class="btn g s" href="${esc(s.maps_url)}" target="_blank" rel="noopener">Get directions</a></p>` : ''}${s.instagram_url ? `<p>📸 <a href="${esc(s.instagram_url)}" target="_blank" rel="noopener noreferrer">Follow Vijay Motors on Instagram</a></p>` : ''}<p>▶️ <a href="https://youtube.com/@vijaymotorshubli6871?si=kx0N23jVkbg5tQME" target="_blank" rel="noopener noreferrer">Watch Vijay Motors on YouTube</a></p></div>
<form class="glass" onsubmit="enq(event)"><label>Name<input name="n" required minlength="2" maxlength="100"></label><label>Phone<input name="p" required inputmode="tel" pattern="[0-9+ \\-]{10,15}"></label><label>Car<select name="c"><option value="">General enquiry</option>${S.cars.filter(c => c.is_published && !sold(c)).map(c => `<option value="${c.id}">${esc(c.make + ' ' + c.model + ' ' + (c.variant || ''))}</option>`).join('')}</select></label><label>Message<textarea name="m" maxlength="500"></textarea></label><p><button class="btn">Send via WhatsApp</button></p></form></div></section>`
    }
    function enq(e) {
      e.preventDefault(); const f = e.target, c = S.cars.find(x => x.id === f.c.value);
      const t = `Hi Vijay Motors, I'm ${f.n.value.trim()} (${f.p.value.trim()}). ${c ? carMsg(c) : 'I have an enquiry.'} ${f.m.value.trim()}`;
      window.open(wa(t), '_blank', 'noopener'); toast('Opening WhatsApp with your enquiry…')
    }
    function detail(id) {
      const c = S.cars.find(x => x.id === id && x.is_published);
      if (!c) return `<div class="w pad"><h2>${S.loading ? 'Loading…' : 'Car not found'}</h2><p class="m">It may have been removed.</p><a class="btn" href="#/">Back to all cars</a></div>`;
      const im = imgs(c), pr = im.find(x => x.is_primary) || im[0], so = sold(c);
      const sp = [['Year', c.manufacturing_year], ['Registration year', c.registration_year && c.registration_year !== c.manufacturing_year ? c.registration_year : ''], ['Fuel', L(c.fuel_type)], ['Transmission', L(c.transmission)], ['Odometer', num(c.kilometers_driven) + ' km'], ['Category', catLabel(c.category)], ['Owners', c.ownership_count], ['Registered in', c.registration_place], ['Colour', c.colour], ['Engine', c.engine_capacity]].filter(r => r[1]);
      const rel = S.cars.filter(x => x.is_published && x.id !== c.id && !sold(x) && x.category === c.category).slice(0, 3);
      return `<div class="w pad"><a href="#/" class="m">← All cars</a><div class="det"><div>${pr ? `<img id="big" src="${esc(pr.url)}" alt="${esc(c.make + ' ' + c.model)}"><div class="th">${im.map(i => `<img loading="lazy" src="${esc(i.url)}" data-u="${esc(i.url)}" alt="" onclick="$('#big').src=this.dataset.u">`).join('')}</div>` : '<div class="img" style="border-radius:20px">No photo yet</div>'}</div>
<div><h1 style="font-size:32px">${esc(c.make)} ${esc(c.model)} ${esc(c.variant)}</h1><div class="pr">${inr(c.price)}</div>${so ? '<div class="soldbn">SOLD OUT</div>' : ''}<div class="spec">${sp.map(r => `<div><small>${r[0]}</small>${esc(r[1])}</div>`).join('')}</div>
<p><a class="btn ${so ? 'off' : ''}" href="tel:${esc(S.set.phone)}">Contact Dealer</a> <a class="btn g ${so ? 'off' : ''}" target="_blank" rel="noopener" href="${wa(carMsg(c))}">WhatsApp Enquiry</a></p>
${c.features && c.features.length ? `<h3>Key features</h3><p>${c.features.map(esc).join(' · ')}</p>` : ''}${c.condition_notes ? `<h3>Condition</h3><p>${esc(c.condition_notes)}</p>` : ''}${c.description ? `<h3>Description</h3><p>${esc(c.description)}</p>` : ''}<p class="m">Vehicle ID #${c.vehicle_code} · Updated ${c.updated_at ? new Date(c.updated_at).toLocaleDateString('en-IN') : '—'}</p></div></div>
${rel.length ? `<h2 style="margin-top:40px">Related cars</h2><div class="grid">${rel.map(card).join('')}</div>` : ''}</div>`
    }

    /* ---------- Admin ---------- */
    function admin() {
      if (!sb) return `<div class="w pad"><h2>Admin</h2><p>Connect Supabase first (see SETUP.md).</p></div>`;
      if (!S.admin) return `<div class="w pad" style="max-width:420px"><h2>Admin login</h2><form class="glass" onsubmit="login(event)"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><p><button class="btn">Sign in</button></p></form></div>`;
      if (S.editing) return form();
      const a = S.cars, av = a.filter(c => !sold(c)).length, s = S.set;
      return `<div class="w pad"><div class="row" style="border:0;background:none;padding:0"><h2>Dashboard</h2><div><button class="btn" onclick="edit('new')">Add car</button> <button class="btn g" onclick="logout()">Log out</button></div></div>
<div class="st"><div><b>${a.length}</b>Total cars</div><div><b>${av}</b>Available</div><div><b>${a.length - av}</b>Sold out</div></div>
<div class="f" style="margin-top:16px"><input placeholder="Search make, model or ID" value="${esc(S.aq)}" oninput="S.aq=this.value;S.ap=0;alist()" aria-label="Search"><select onchange="S.as=this.value;S.ap=0;alist()" aria-label="Status"><option value="">All status</option><option value="available" ${S.as === 'available' ? 'selected' : ''}>Available</option><option value="sold_out" ${S.as === 'sold_out' ? 'selected' : ''}>Sold Out</option></select></div><div id="alist"></div>
<details class="glass"><summary>Business settings</summary><form onsubmit="saveSet(event)"><div class="f"><label>Phone<input name="phone" value="${esc(s.phone)}"></label><label>WhatsApp number (with 91)<input name="wa" value="${esc(s.whatsapp_number)}"></label><label>Address<input name="address" value="${esc(s.address)}"></label><label>Google Maps link<input name="maps" value="${esc(s.maps_url)}"></label></div><label style="color:inherit"><input type="checkbox" name="show" style="width:auto" ${s.show_sold_cars ? 'checked' : ''}> Keep sold cars visible on the website</label><p><button class="btn s">Save settings</button></p></form></details></div>`
    }
    function alist() {
      const q = S.aq.toLowerCase(); let a = S.cars.filter(c => (!q || (c.make + ' ' + c.model + ' ' + c.vehicle_code).toLowerCase().includes(q)) && (!S.as || c.status === S.as));
      const n = Math.ceil(a.length / 10) || 1; S.ap = Math.min(S.ap, n - 1); const pg = a.slice(S.ap * 10, S.ap * 10 + 10);
      $('#alist').innerHTML = (pg.length ? pg.map(c => `<div class="row"><div><b>${esc(c.make)} ${esc(c.model)} ${esc(c.variant)}</b><br><span class="m">#${c.vehicle_code} · ${c.manufacturing_year} · ${inr(c.price)} · ${sold(c) ? '<b>SOLD OUT</b>' : 'Available'}${c.is_published ? '' : ' · Draft'}</span></div><div><button class="btn g s" onclick="edit('${c.id}')">Edit</button> <button class="btn g s" onclick="tog('${c.id}')">${sold(c) ? 'Mark Available' : 'Mark as Sold Out'}</button> <button class="btn g s" onclick="del('${c.id}')">Delete</button></div></div>`).join('') : '<p class="m">No cars yet. Click “Add car”.</p>') + (n > 1 ? `<p><button class="btn g s" onclick="S.ap--;alist()" ${S.ap ? '' : 'disabled'}>Prev</button> Page ${S.ap + 1}/${n} <button class="btn g s" onclick="S.ap++;alist()" ${S.ap < n - 1 ? '' : 'disabled'}>Next</button></p>` : '')
    }
    async function chk() { const { data } = await sb.auth.getSession(); S.admin = null; if (!data.session) return; const r = await sb.rpc('is_admin'); if (r.data === true) S.admin = data.session.user.email; else { await sb.auth.signOut(); toast('This account is not authorised.') } }
    async function login(e) { e.preventDefault(); const f = e.target, r = await sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.password.value }); if (r.error) return toast('Incorrect email or password.'); await chk(); await load() }
    async function logout() { await sb.auth.signOut(); S.admin = null; S.editing = null; await load(); location.hash = '/' }
    async function tog(id) {
      const c = S.cars.find(x => x.id === id), ns = sold(c) ? 'available' : 'sold_out';
      if (!confirm(ns === 'sold_out' ? 'Mark this car as Sold Out?' : 'Mark this car as Available again?')) return;
      const r = await sb.from('cars').update({ status: ns }).eq('id', id); toast(r.error ? 'Could not update status.' : 'Status updated.'); load()
    }
    async function del(id) {
      const c = S.cars.find(x => x.id === id); if (!confirm(`Permanently delete ${c.make} ${c.model}? This cannot be undone. (To hide it instead, edit and untick “Publish”.)`)) return;
      const paths = (c.car_images || []).map(i => i.storage_path), r = await sb.from('cars').delete().eq('id', id);
      if (r.error) return toast('Could not delete. Nothing was removed.');
      if (paths.length) await sb.storage.from('car-images').remove(paths); toast('Car deleted.'); load()
    }
    async function saveSet(e) { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)), r = await sb.from('business_settings').update({ phone: f.phone || null, whatsapp_number: f.wa || null, address: f.address || null, maps_url: f.maps || null, show_sold_cars: !!f.show }).eq('id', 1); toast(r.error ? 'Could not save settings.' : 'Settings saved.'); load() }
    function edit(id) { S.editing = id; const c = id === 'new' ? null : S.cars.find(x => x.id === id); S.old = c ? imgs(c) : []; S.im = S.old.map(x => ({ ...x, primary: x.is_primary })); render() }
    const I = (n, l, v, t = 'text', x = '') => `<div><label for="${n}">${l}</label><input id="${n}" name="${n}" type="${t}" value="${esc(v)}" ${x}></div>`;
    const Sl = (n, l, o, v) => `<div><label for="${n}">${l}</label><select id="${n}" name="${n}">${o.map(x => `<option value="${x[0]}" ${x[0] === v ? 'selected' : ''}>${x[1]}</option>`).join('')}</select></div>`;
    function form() {
      const c = S.editing === 'new' ? { status: 'available', fuel_type: 'petrol', transmission: 'manual', category: S.cats[0] && S.cats[0].slug, is_published: true } : S.cars.find(x => x.id === S.editing) || {};
      return `<form class="w pad" onsubmit="save(event)"><h2>${S.editing === 'new' ? 'Add car' : 'Edit car'}</h2><div class="f">${I('make', 'Make *', c.make, 'text', 'required')}${I('model', 'Model *', c.model, 'text', 'required')}${I('variant', 'Variant', c.variant)}${I('year', 'Manufacturing year *', c.manufacturing_year, 'number', 'required min=1990')}${I('ry', 'Registration year', c.registration_year, 'number')}${Sl('category', 'Category', S.cats.map(k => [k.slug, k.label]), c.category)}${I('price', 'Asking price (₹) *', c.price, 'number', 'required min=1')}${Sl('fuel', 'Fuel', FUELS.map(x => [x, L(x)]), c.fuel_type)}${Sl('tr', 'Transmission', [['manual', 'Manual'], ['automatic', 'Automatic']], c.transmission)}${I('km', 'Odometer (km) *', c.kilometers_driven, 'number', 'required min=0')}${I('own', 'Previous owners', c.ownership_count, 'number', 'min=1')}${I('place', 'Registered in', c.registration_place)}${I('colour', 'Colour', c.colour)}${I('eng', 'Engine capacity', c.engine_capacity)}${Sl('status', 'Availability', [['available', 'Available'], ['sold_out', 'Sold Out']], c.status)}</div>
<label for="features">Key features (comma separated)</label><input id="features" name="features" value="${esc((c.features || []).join(', '))}"><label for="cond">Condition notes</label><textarea id="cond" name="cond">${esc(c.condition_notes)}</textarea><label for="desc">Description</label><textarea id="desc" name="desc">${esc(c.description)}</textarea>
<h3 style="margin-top:16px">Photos (JPG, PNG, WebP, max 5 MB each)</h3><input type="file" accept="image/jpeg,image/png,image/webp" multiple onchange="imAdd(this.files)"><div id="ims" class="ims"></div>
<label style="color:inherit"><input type="checkbox" name="pub" style="width:auto" ${c.is_published ? 'checked' : ''}> Publish on website (untick to save as draft)</label><p><button class="btn" id="sv">Save</button> <button type="button" class="btn g" onclick="S.editing=null;render()">Cancel</button></p></form>`
    }
    function ims() { $('#ims').innerHTML = S.im.map((m, i) => `<div class="im ${m.primary ? 'p1' : ''}"><img src="${esc(m.url)}" alt=""><button type="button" onclick="imP(${i})">${m.primary ? '★ Primary' : 'Set primary'}</button><button type="button" onclick="imU(${i})" aria-label="Move earlier">←</button><button type="button" onclick="imX(${i})">Remove</button></div>`).join('') || '<p class="m">No photos yet.</p>' }
    function imAdd(fl) { for (const f of fl) { if (!EXT[f.type]) { toast('Only JPG, PNG or WebP images.'); continue } if (f.size > 5242880) { toast(f.name + ' is over 5 MB.'); continue } S.im.push({ file: f, url: URL.createObjectURL(f), primary: !S.im.length }) } ims() }
    function imP(i) { S.im.forEach((m, j) => m.primary = i === j); ims() }
    function imU(i) { if (i) { [S.im[i - 1], S.im[i]] = [S.im[i], S.im[i - 1]] } ims() }
    function imX(i) { const w = S.im[i].primary; S.im.splice(i, 1); if (w && S.im.length) S.im[0].primary = true; ims() }
    async function save(e) {
      e.preventDefault(); const fd = Object.fromEntries(new FormData(e.target)), id = S.editing === 'new' ? null : S.editing, b = $('#sv');
      if (!fd.make.trim() || !fd.model.trim() || !(+fd.price > 0) || +fd.km < 0 || !(+fd.year >= 1990)) return toast('Please fill all required fields correctly.');
      b.disabled = true; const T = x => (x || '').trim() || null;
      const row = { make: fd.make.trim(), model: fd.model.trim(), variant: T(fd.variant), manufacturing_year: +fd.year, registration_year: fd.ry ? +fd.ry : null, category: fd.category, price: +fd.price, fuel_type: fd.fuel, transmission: fd.tr, kilometers_driven: +fd.km, ownership_count: fd.own ? +fd.own : null, registration_place: T(fd.place), colour: T(fd.colour), engine_capacity: T(fd.eng), features: fd.features.split(',').map(x => x.trim()).filter(Boolean), description: T(fd.desc), condition_notes: T(fd.cond), status: fd.status, is_published: !!fd.pub };
      const r = id ? await sb.from('cars').update(row).eq('id', id).select('id').single() : await sb.from('cars').insert(row).select('id').single();
      if (r.error) { b.disabled = false; return toast('Could not save. Please check the values.') }
      const cid = r.data.id, keep = S.im.filter(x => x.id).map(x => x.id), gone = S.old.filter(x => !keep.includes(x.id));
      if (gone.length) { await sb.from('car_images').delete().in('id', gone.map(x => x.id)); await sb.storage.from('car-images').remove(gone.map(x => x.storage_path)) }
      let bad = 0; for (let i = 0; i < S.im.length; i++) {
        const m = S.im[i]; if (!m.file) continue; toast(`Uploading photo ${i + 1} of ${S.im.length}…`);
        const p = `${cid}/${Date.now()}-${i}.${EXT[m.file.type]}`, u = await sb.storage.from('car-images').upload(p, m.file, { contentType: m.file.type });
        if (u.error) { bad++; continue } const n = await sb.from('car_images').insert({ car_id: cid, storage_path: p, display_order: i, is_primary: false }).select('id').single(); m.id = n.data && n.data.id; m.storage_path = p
      }
      const ok = S.im.filter(m => m.id); await sb.from('car_images').update({ is_primary: false }).eq('car_id', cid);
      for (let i = 0; i < ok.length; i++)await sb.from('car_images').update({ display_order: i, is_primary: !!ok[i].primary || (i === 0 && !ok.some(m => m.primary)) }).eq('id', ok[i].id);
      const pm = ok.find(m => m.primary) || ok[0]; await sb.from('cars').update({ primary_image: pm ? pm.storage_path : null }).eq('id', cid);
      S.editing = null; await load(); toast(bad ? `Saved, but ${bad} photo(s) failed to upload.` : 'Car saved.')
    }

    /* ---------- Shell & routing ---------- */
    function go(id) { if ((location.hash.slice(1) || '/') !== '/') { location.hash = '/'; setTimeout(() => go(id), 60); return } document.getElementById(id) && document.getElementById(id).scrollIntoView({ behavior: 'smooth' }); $('header').classList.remove('open') }
    function render() {
      const h = location.hash.slice(1) || '/', s = S.set, v = h === '/privacy' ? '<div class="w pad"><h2>Privacy policy</h2><p>Placeholder: replace with your policy text. Enquiries are sent through WhatsApp and are not stored on this website.</p></div>' : h.startsWith('/admin') ? admin() : h.startsWith('/car/') ? detail(h.slice(5)) : home();
      $('#app').innerHTML = `<header><div class="w nav"><a class="logo" href="#/"><img src="${LOGO}" alt="Vijay Motors logo"><span><b>VIJAY</b> MOTORS</span></a><button id="ham" aria-label="Menu" onclick="$('header').classList.toggle('open')">☰</button><nav><a href="#/" onclick="go('top');window.scrollTo(0,0);return false">Home</a><a href="#/" onclick="go('browse');return false">Browse Cars</a><a href="#/" onclick="go('categories');return false">Categories</a><a href="#/" onclick="go('about');return false">About Us</a><a href="#/" onclick="go('contact');return false">Contact</a><a class="adm" href="#/admin">Admin Login</a></nav><a class="btn s dbtn" href="#/" onclick="go('browse');return false">Explore Cars</a></div></header><main>${v}</main>
<footer><div class="w"><img src="${LOGO}" alt="" style="width:56px;height:56px;border-radius:50%;vertical-align:middle;margin-right:10px"><b style="color:var(--ink)">VIJAY MOTORS</b> · ${esc(s.tagline)}<p>${esc(s.address)}<br>📞 ${esc(s.phone)} · <a href="${wa('Hi Vijay Motors')}" target="_blank" rel="noopener">WhatsApp</a>${s.instagram_url ? ` · <a href="${esc(s.instagram_url)}" target="_blank" rel="noopener noreferrer">Instagram</a>` : ''} · <a href="https://youtube.com/@vijaymotorshubli6871?si=kx0N23jVkbg5tQME" target="_blank" rel="noopener noreferrer">YouTube</a></p><p>© ${new Date().getFullYear()} Vijay Motors. <a href="#/privacy">Privacy policy</a> · <a href="#/admin">Admin Login</a></p></div></footer>`;
      if ($('#res')) results(); if ($('#alist')) alist(); if ($('#ims')) ims()
    }
    addEventListener('hashchange', () => { render(); scrollTo(0, 0) });
    (async () => { render(); if (sb) await chk(); await load(); live() })();
  </script>
</body>
